version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mathuram_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mathuram_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mathuram_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

  web:
    build: .
    container_name: mathuram_web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/mathuram_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    command: npm run start

  worker:
    build: .
    container_name: mathuram_worker
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/mathuram_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    command: npx tsx worker.ts

volumes:
  pgdata:
  redisdata:
